<svg width="420" height="140" viewBox="0 0 420 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="420" height="140" fill="white"/>

  <!-- Swoosh -->
  <path
    d="M10 95
       C 80 70, 150 70, 230 90
       C 280 102, 330 105, 410 90
       L 410 110
       C 330 125, 270 125, 210 115
       C 140 103, 80 100, 10 115 Z"
    fill="#00A86B"/>

  <path
    d="M10 90
       C 80 60, 160 55, 240 75
       C 300 90, 350 90, 410 80
       L 410 90
       C 350 105, 295 108, 235 95
       C 160 78, 90 80, 10 100 Z"
    fill="#0077CC"/>

  <!-- Buildings -->
  <!-- Left building -->
  <rect x="70" y="35" width="35" height="55" fill="#1E88E5"/>
  <rect x="76" y="42" width="6" height="8" fill="white"/>
  <rect x="88" y="42" width="6" height="8" fill="white"/>
  <rect x="76" y="56" width="6" height="8" fill="white"/>
  <rect x="88" y="56" width="6" height="8" fill="white"/>

  <!-- Middle skyscraper -->
  <rect x="115" y="20" width="40" height="80" fill="#1565C0"/>
  <rect x="122" y="28" width="8" height="10" fill="white"/>
  <rect x="135" y="28" width="8" height="10" fill="white"/>
  <rect x="122" y="45" width="8" height="10" fill="white"/>
  <rect x="135" y="45" width="8" height="10" fill="white"/>
  <rect x="122" y="62" width="8" height="10" fill="white"/>
  <rect x="135" y="62" width="8" height="10" fill="white"/>

  <!-- Right building -->
  <rect x="165" y="30" width="32" height="70" fill="#1976D2"/>
  <rect x="171" y="38" width="7" height="9" fill="white"/>
  <rect x="181" y="38" width="7" height="9" fill="white"/>
  <rect x="171" y="52" width="7" height="9" fill="white"/>
  <rect x="181" y="52" width="7" height="9" fill="white"/>

  <!-- Hard hat -->
  <g transform="translate(185,70)">
    <!-- Hat base -->
    <ellipse cx="40" cy="25" rx="32" ry="10" fill="#F9A825"/>
    <!-- Dome -->
    <path
      d="M12 25
         C 15 5, 65 5, 68 25
         Z"
      fill="#FFCA28"/>
    <!-- Ridge -->
    <rect x="36" y="8" width="8" height="14" fill="#FBC02D"/>
  </g>

  <!-- Text -->
  <text x="250" y="65"
        font-family="Inter, Arial, sans-serif"
        font-size="26"
        font-weight="600"
        fill="#1565C0">
    Construction Runner
  </text>
</svg>