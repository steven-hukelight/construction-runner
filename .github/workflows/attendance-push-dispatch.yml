# Drains the Supabase `notifications` queue and sends OneSignal pushes for
# `attendance_auto_sign_out` rows (see sitehub-admin/lib/dispatchAttendancePushQueue.ts).
#
# Vercel Hobby only allows at-most-daily crons in vercel.json, so this workflow
# replaces a */5 Vercel cron for push delivery.
#
# Required repository secrets (Settings → Secrets → Actions):
#   ATTENDANCE_DISPATCH_URL — full URL, e.g.
#     https://www.construction-runner.com/api/maintenance/dispatch-attendance-push-queue
#   CRON_SECRET — same value as CRON_SECRET on Vercel (must match Bearer token check)

name: Attendance push dispatch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: POST dispatch-attendance-push-queue
        env:
          URL: ${{ secrets.ATTENDANCE_DISPATCH_URL }}
          TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          # Skip cleanly until secrets are configured (job-level `if` cannot read secrets).
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "ATTENDANCE_DISPATCH_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl -sfS -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Dispatch OK"
